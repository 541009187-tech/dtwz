<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vite+CF-KV 云端动态待办</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 transition-colors duration-300 min-h-screen p-6">
  <div class="max-w-2xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-[clamp(1.8rem,4vw,2.5rem)] font-bold text-slate-800 dark:text-white">☁️ Vite云端动态待办</h1>
      <button id="themeBtn" class="px-4 py-2 rounded-lg bg-slate-200 dark:bg-slate-700 dark:text-white">切换暗色</button>
    </div>
    <div class="p-6 rounded-xl bg-white dark:bg-slate-800 shadow mb-6">
      <h2 class="text-lg font-semibold mb-2 text-slate-700 dark:text-slate-200">🕒 实时时钟</h2>
      <div id="clock" class="text-2xl font-mono text-blue-600 dark:text-blue-400"></div>
    </div>
    <div class="p-6 rounded-xl bg-white dark:bg-slate-800 shadow">
      <h2 class="text-lg font-semibold mb-4 text-slate-700 dark:text-slate-200">📝 云端待办（存CF云端，跨设备同步）</h2>
      <div class="flex gap-2 mb-4">
        <input id="todoInput" type="text" placeholder="输入待办..." class="flex-1 px-4 py-2 border rounded-lg dark:bg-slate-700 dark:border-slate-600 dark:text-white">
        <button id="addTodo" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">添加</button>
      </div>
      <ul id="todoList" class="space-y-2"></ul>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
